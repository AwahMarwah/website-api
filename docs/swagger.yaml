      subtotal:
        type: number
    type: object
  order.OrderResponse:
    properties:
      address_id:
        type: string
      created_at:
        type: string
      expired_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/order.OrderItemResponse'
        type: array
      payment_method:
        type: string
      payment_url:
        type: string
      shipping_fee:
        type: number
      status:
        type: string
      total_amount:
        type: number
    type: object
  order.PaymentLinkResponse:
    properties:
      order_id:
        type: string
      url:
        type: string
    type: object
  order.ShippingsReq:
    properties:
      courier:
        type: string
      merchant_id:
        type: string
      service:
        type: string
    type: object
  product.ProductDetailResponse:
    properties:
      base_price:
        type: number
      brand_id:
        type: string
      brand_name:
        type: string
      description:
        type: string
      id:
        type: string
      is_in_stock:
        type: integer
      max_price:
        type: number
      merchant_id:
        type: string
      merchant_name:
        type: string
      min_price:
        type: number
      name:
        type: string
      rating:
        type: number
      slug:
        type: string
      thumbnail:
        type: string
      total_review:
        type: integer
      variants:
        items:
          $ref: '#/definitions/product.VariantResponse'
        type: array
    type: object
  product.VariantResponse:
    properties:
      id:
        type: string
      price:
        type: number
      sku:
        type: string
      stock:
        type: integer
      variant_name:
        type: string
      weight:
        type: number
    type: object
  shipping.MerchantShipping:
    properties:
      merchant_id:
        type: string
      merchant_name:
        type: string
      options:
        items:
          $ref: '#/definitions/shipping.ShippingOption'
        type: array
      weight_gram:
        type: integer
      weight_kg:
        type: integer
    type: object
  shipping.ShippingCostItem:
    properties:
      qty:
        minimum: 1
        type: integer
      variant_id:
        type: string
    required:
    - qty
    - variant_id
    type: object
  shipping.ShippingCostRequest:
    properties:
      address_id:
        type: string
      couriers:
        items:
          type: string
        type: array
      items:
        items:
          $ref: '#/definitions/shipping.ShippingCostItem'
        type: array
    required:
    - address_id
    - items
    type: object
  shipping.ShippingOption:
    properties:
      cost:
        type: integer
      courier:
        type: string
      etd:
        type: string
      service:
        type: string
    type: object
host: localhost:8085
info:
  contact: {}
  description: Api Documentation for Website
  title: Website Api
  version: "1.0"
paths:
  /admin/orders:
    get:
      description: Mengambil semua order (khusus admin)
      parameters:
      - description: Filter status order
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar order
          schema:
            $ref: '#/definitions/order.OrderResponse'
      summary: List Orders (Admin)
      tags:
      - 4. Order
  /content-page/faqs:
    get:
      consumes:
      - application/json
      description: Retrieve list information of Faqs
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Faqs
      tags:
      - 2. Content Page
  /content-page/pages/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information of a content page using its slug
      parameters:
      - description: Content Page Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"data": content_page.DetailResponse, "message": ""}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"data": null, "message": "Bad Request"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"data": null, "message": "Internal Server Error"}'
          schema:
            additionalProperties: true
            type: object
      summary: Get Content Page by Slug
      tags:
      - 2. Content Page
  /health:
    get:
      consumes:
      - application/json
      description: Check application health status
      produces:
      - application/json
      responses:
        "200":
          description: '{"data": null, "message": "successfully checked"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"data": null, "message": "internal server error"}'
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - 1. Health Check
  /master/cities:
    get:
      consumes:
      - application/json
      description: Mengambil master list cities
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: province_id
        type: string
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data city
          schema:
            $ref: '#/definitions/master.SwaggerCityPagination'
      summary: Get List Cities
      tags:
      - 3. Master
  /master/district:
    get:
      consumes:
      - application/json
      description: Mengambil master list district
      parameters:
      - in: query
        name: city_id
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data district
          schema:
            $ref: '#/definitions/master.SwaggerDistrictPagination'
      summary: Get List District
      tags:
      - 3. Master
  /master/provincies:
    get:
      consumes:
      - application/json
      description: Mengambil master list province
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data provinsi
          schema:
            $ref: '#/definitions/master.SwaggerProvincePagination'
      summary: Get List Province
      tags:
      - 3. Master
  /master/subdistricts:
    get:
      consumes:
      - application/json
      description: Mengambil master list subdistricts/kelurahan berdasarkan district
      parameters:
      - in: query
        name: district_id
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data subdistrict
          schema:
            $ref: '#/definitions/master.SwaggerSubdistrictPagination'
      summary: Get List Subdistricts
      tags:
      - 3. Master
  /merchant:
    get:
      consumes:
      - application/json
      description: Mengambil daftar merchant (toko) yang aktif
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar merchant
          schema:
            $ref: '#/definitions/merchant.MerchantResponse'
      summary: Get Merchants
      tags:
      - Merchant
  /order:
    get:
      description: Mengambil daftar order milik user yang login
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar order
          schema:
            $ref: '#/definitions/order.OrderResponse'
      summary: List Orders (User)
      tags:
      - 4. Order
    post:
      consumes:
      - application/json
      description: Membuat order baru dan menginisiasi pembayaran via Midtrans Snap
      parameters:
      - description: Checkout Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/order.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order berhasil dibuat
          schema:
            $ref: '#/definitions/order.CheckoutResponse'
      summary: Checkout
      tags:
      - 4. Order
  /order/{id}:
    get:
      description: Mengambil detail order beserta item (hanya pemilik order atau admin)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail order
          schema:
            $ref: '#/definitions/order.OrderResponse'
      summary: Get Order Detail
      tags:
      - 4. Order
  /order/{id}/payment-link:
    post:
      consumes:
      - application/json
      description: Membuat payment link Midtrans untuk order yang masih PENDING sehingga
        bisa dibagikan
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment link berhasil dibuat
          schema:
            $ref: '#/definitions/order.PaymentLinkResponse'
      summary: Create Payment Link
      tags:
      - 4. Order
  /order/notification:
    post:
      consumes:
      - application/json
      description: Merespons notifikasi webhook dari Midtrans (public endpoint, tanpa
        auth)
      parameters:
      - description: Midtrans Notification Payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/midtrans.NotificationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Notifikasi diproses
          schema:
            $ref: '#/definitions/order.NotificationResponse'
      summary: Handle Payment Notification
      tags:
      - 4. Order
  /product/{id}:
    get:
      consumes:
      - application/json
      description: Mengambil detail produk beserta variannya
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail produk
          schema:
            $ref: '#/definitions/product.ProductDetailResponse'
      summary: Get Product Detail
      tags:
      - Product
  /shipping/cost:
    post:
      consumes:
      - application/json
      description: Menghitung ongkir real per merchant untuk item checkout
      parameters:
      - description: Quote Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/shipping.ShippingCostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil menghitung ongkir
          schema:
            $ref: '#/definitions/shipping.MerchantShipping'
      summary: Quote Shipping Cost
      tags:
      - Shipping
swagger: "2.0"
tags:
- name: 1. Health Check
- name: 2. Content Page
- name: 3. Master
- name: 4. Order
- name: 5. Product
- name: 6. Menu & RBAC
