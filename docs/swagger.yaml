  merchant.MerchantResponse:
    properties:
      address:
        type: string
      city_id:
        type: string
      destination_id:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      slug:
        type: string
    type: object
  midtrans.NotificationPayload:
    properties:
      currency:
        type: string
      expiry_time:
        type: string
      fraud_status:
        type: string
      gross_amount:
        type: string
      merchant_id:
        type: string
      order_id:
        type: string
      payment_code:
        type: string
      payment_type:
        type: string
      settlement_time:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      status_message:
        type: string
      store:
        type: string
      transaction_id:
        type: string
      transaction_status:
        type: string
      transaction_time:
        type: string
      va_numbers:
        items:
          $ref: '#/definitions/midtrans.VaNumber'
        type: array
    type: object
  midtrans.VaNumber:
    properties:
      bank:
        type: string
      va_number:
        type: string
    type: object
  order.CheckoutItem:
    properties:
      qty:
        type: integer
      variant_id:
        type: string
    type: object
  order.CheckoutRequest:
    properties:
      address_id:
        type: string
      items:
        items:
          $ref: '#/definitions/order.CheckoutItem'
        type: array
      payment_method:
        type: string
      shipping_fee:
        type: number
      shippings:
        items:
          $ref: '#/definitions/order.ShippingsReq'
        type: array
      user_id:
        type: string
    required:
    - address_id
    - payment_method
    - shipping_fee
    type: object
  order.CheckoutResponse:
    properties:
      expires_at:
        type: string
      order_id:
        type: string
      payment_token:
        type: string
      payment_url:
        type: string
    type: object
  order.NotificationResponse:
    properties:
      order_id:
        type: string
      processed:
