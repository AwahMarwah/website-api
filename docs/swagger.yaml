basePath: /
definitions:
  master.ListCityResponse:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      province_id:
        type: string
    type: object
  master.ListDistrictResponse:
    properties:
      city_id:
        type: string
      code:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  master.ListProvinceResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  master.SwaggerCityPagination:
    properties:
      data:
        items:
          $ref: '#/definitions/master.ListCityResponse'
        type: array
      message:
        example: OK
        type: string
      page:
        properties:
          current:
            example: 1
            type: integer
          size:
            example: 10
            type: integer
          total:
            example: 37
            type: integer
        type: object
    type: object
  master.SwaggerDistrictPagination:
    properties:
      data:
        items:
          $ref: '#/definitions/master.ListDistrictResponse'
        type: array
      message:
        example: OK
        type: string
      page:
        properties:
          current:
            example: 1
            type: integer
          size:
            example: 10
            type: integer
          total:
            example: 37
            type: integer
        type: object
    type: object
  master.SwaggerProvincePagination:
    properties:
      data:
        items:
          $ref: '#/definitions/master.ListProvinceResponse'
        type: array
      message:
        example: OK
        type: string
      page:
        properties:
          current:
            example: 1
            type: integer
          size:
            example: 10
            type: integer
          total:
            example: 37
            type: integer
        type: object
    type: object
  midtrans.NotificationPayload:
    properties:
      currency:
        type: string
      expiry_time:
        type: string
      fraud_status:
        type: string
      gross_amount:
        type: string
      merchant_id:
        type: string
      order_id:
        type: string
      payment_code:
        type: string
      payment_type:
        type: string
      settlement_time:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      status_message:
        type: string
      store:
        type: string
      transaction_id:
        type: string
      transaction_status:
        type: string
      transaction_time:
        type: string
      va_numbers:
        items:
          $ref: '#/definitions/midtrans.VaNumber'
        type: array
    type: object
  midtrans.VaNumber:
    properties:
      bank:
        type: string
      va_number:
        type: string
    type: object
  order.CheckoutItem:
    properties:
      qty:
        type: integer
      variant_id:
        type: string
    type: object
  order.CheckoutRequest:
