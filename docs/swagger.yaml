        items:
          $ref: '#/definitions/order.CheckoutItem'
        type: array
      payment_method:
        type: string
      shipping_fee:
        type: number
      user_id:
        type: string
    required:
    - address_id
    - payment_method
    - shipping_fee
    type: object
  order.CheckoutResponse:
    properties:
      expires_at:
        type: string
      order_id:
        type: string
      payment_token:
        type: string
      payment_url:
        type: string
    type: object
  order.NotificationResponse:
    properties:
      order_id:
        type: string
      processed:
        type: boolean
      status:
        type: string
    type: object
  order.PaymentLinkResponse:
    properties:
      order_id:
        type: string
      url:
        type: string
    type: object
host: localhost:8085
info:
  contact: {}
  description: Api Documentation for Website
  title: Website Api
  version: "1.0"
paths:
  /content-page/faqs:
    get:
      consumes:
      - application/json
      description: Retrieve list information of Faqs
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Faqs
      tags:
      - 2. Content Page
  /content-page/pages/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information of a content page using its slug
      parameters:
      - description: Content Page Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"data": content_page.DetailResponse, "message": ""}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{"data": null, "message": "Bad Request"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"data": null, "message": "Internal Server Error"}'
          schema:
            additionalProperties: true
            type: object
      summary: Get Content Page by Slug
      tags:
      - 2. Content Page
  /health:
    get:
      consumes:
      - application/json
      description: Check application health status
      produces:
      - application/json
      responses:
        "200":
          description: '{"data": null, "message": "successfully checked"}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{"data": null, "message": "internal server error"}'
          schema:
            additionalProperties: true
            type: object
      summary: Health Check
      tags:
      - 1. Health Check
  /master/cities:
    get:
      consumes:
      - application/json
      description: Mengambil master list cities
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: province_id
        type: string
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data city
          schema:
            $ref: '#/definitions/master.SwaggerCityPagination'
      summary: Get List Cities
      tags:
      - 3. Master
  /master/district:
    get:
      consumes:
      - application/json
      description: Mengambil master list district
      parameters:
      - in: query
        name: city_id
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data district
          schema:
            $ref: '#/definitions/master.SwaggerDistrictPagination'
      summary: Get List District
      tags:
      - 3. Master
  /master/provincies:
    get:
      consumes:
      - application/json
      description: Mengambil master list province
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data provinsi
          schema:
            $ref: '#/definitions/master.SwaggerProvincePagination'
      summary: Get List Province
      tags:
      - 3. Master
  /order:
    post:
      consumes:
      - application/json
      description: Membuat order baru dan menginisiasi pembayaran via Midtrans Snap
      parameters:
      - description: Checkout Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/order.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order berhasil dibuat
          schema:
            $ref: '#/definitions/order.CheckoutResponse'
      summary: Checkout
      tags:
      - 4. Order
  /order/{id}/payment-link:
    post:
      consumes:
      - application/json
      description: Membuat payment link Midtrans untuk order yang masih PENDING sehingga
        bisa dibagikan
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payment link berhasil dibuat
          schema:
            $ref: '#/definitions/order.PaymentLinkResponse'
      summary: Create Payment Link
      tags:
      - 4. Order
  /order/notification:
    post:
      consumes:
      - application/json
      description: Merespons notifikasi webhook dari Midtrans (public endpoint, tanpa
        auth)
      parameters:
      - description: Midtrans Notification Payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/midtrans.NotificationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Notifikasi diproses
          schema:
            $ref: '#/definitions/order.NotificationResponse'
      summary: Handle Payment Notification
      tags:
      - 4. Order
swagger: "2.0"
tags:
- name: 1. Health Check
- name: 2. Content Page
- name: 3. Master
