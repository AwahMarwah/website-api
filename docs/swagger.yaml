      page:
        properties:
          current:
            example: 1
            type: integer
          size:
            example: 10
            type: integer
          total:
            example: 37
            type: integer
        type: object
    type: object
  master.SwaggerProvincePagination:
    properties:
      data:
        items:
          $ref: '#/definitions/master.ListProvinceResponse'
        type: array
      message:
        example: OK
        type: string
      page:
        properties:
          current:
            example: 1
            type: integer
          size:
            example: 10
            type: integer
