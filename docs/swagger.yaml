host: localhost:8085
info:
  contact: {}
  description: Api Documentation for Website
  title: Website Api
  version: "1.0"
paths:
  /admin/orders:
    get:
      description: Mengambil semua order (khusus admin)
      parameters:
      - description: Filter status order
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar order
          schema:
            $ref: '#/definitions/order.OrderResponse'
      summary: List Orders (Admin)
      tags:
      - 4. Order
  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Mengubah status order oleh admin dengan validasi transisi maju
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Body
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: Status order berhasil diubah
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update Order Status (Admin)
      tags:
      - 4. Order
  /admin/payouts:
    get:
      description: Daftar pengajuan pencairan dana
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: merchant_id
        type: string
      - in: query
        name: offset
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar payout
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Payouts (Finance)
      tags:
      - 9. Settlement
  /admin/payouts/{id}/approve:
    patch:
      consumes:
      - application/json
      description: Menyetujui payout dan mencatat pencairan ke ledger seller
      parameters:
      - description: Payout ID
        in: path
        name: id
        required: true
        type: string
      - description: Body
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/settlement.ApprovePayoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: Payout berhasil disetujui
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Approve Payout
      tags:
      - 9. Settlement
  /admin/payouts/{id}/paid:
    patch:
      description: Menandai payout yang sudah disetujui sebagai lunas ditransfer
      parameters:
      - description: Payout ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Payout ditandai lunas
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Mark Payout Paid
      tags:
      - 9. Settlement
  /admin/payouts/{id}/reject:
    patch:
      consumes:
      - application/json
      description: Menolak pengajuan payout. Saldo seller tidak terpengaruh.
      parameters:
      - description: Payout ID
        in: path
        name: id
        required: true
        type: string
      - description: Body
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/settlement.ApprovePayoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: Payout berhasil ditolak
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Reject Payout
      tags:
      - 9. Settlement
  /admin/refunds:
    get:
      description: Daftar permintaan refund
      parameters:
      - in: query
        name: limit
        type: integer
      - in: query
        name: merchant_id
        type: string
      - in: query
        name: offset
        type: integer
      - in: query
        name: order_id
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar refund
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
